    <script src="app.js"></script>

    <!-- CSS for QR Code -->
    <style>
    .qr-section {
        display: none; /* Default hide */
        text-align: center;
        margin: 30px 0 0 0;
    }

    .qr-section img {
        border: 2px solid #ccc;
        border-radius: 12px;
        padding: 10px;
        background: #fff;
        max-width: 180px;
        height: auto;
    }

    .qr-section h3 {
        font-family: sans-serif;
        margin-bottom: 10px;
        font-size: 16px;
    }

    /* Show QR only on desktop (>1024px) */
    @media (min-width: 1025px) {
        .qr-section {
            display: block;
        }
    }
